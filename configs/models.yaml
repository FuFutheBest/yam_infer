# The ONE model `bash scripts/run_robot.sh` runs, and how to read it.
# To switch: edit `model:` below, or comment it out and uncomment
# another block.  Exactly one `model:` may be active.
#
#   ckpt         model file (relative to the project root)
#   format       act_v2  : old, opus_inference_train; one file for
#                          several tasks, 240x320 images, chunk 50
#                act_ref : yam_train (official ACT source); one task
#                          per file, 480x640 images, chunk 100
#   task         the task to run.  act_v2: pick one of the tasks the
#                file contains; act_ref: the file's own task
#   action_mode  what the network outputs:
#                  delta : change relative to the current follower
#                          state (target = current + output)
#                  abs   : absolute joint angles
#   compensate_action_shift   act_ref only, optional (default false)
#                act_ref learns step 0 = leader at t-1.  false: run
#                step 0 at the observation time (like the source);
#                true: shift the plan 1/fps (33 ms) earlier
#
# format / task / action_mode are checked against the file at start:
# a mismatch stops the program (a wrong action_mode would send wrong
# targets).
# How the plans are executed (chunk / ensemble ...) is set in run.yaml
# only; for act_ref the official ACT way is run.yaml
#   execution: {mode: ensemble, ensemble_m: 0.01}

# ---- old act_v2 model (one file, two tasks: choose with `task`) ----
# model:
#   ckpt: models/act_v2_all.pt
#   format: act_v2
#   # put_blue_block_in_blue_cup | put_banana_in_bowl
#   task: put_blue_block_in_blue_cup
#   action_mode: delta

# ---- new yam_train act_ref model (one task per file) ----
# model:
#   ckpt: models/banana_delta.pt
#   format: act_ref
#   task: put_banana_in_bowl
#   action_mode: delta          # banana_abs.pt -> abs
#   compensate_action_shift: false

# ---- yam_train act_ref, round 3 (2026-11-02): models/act_ref_r3/ ----
# Trained on every demo (_all runs, epoch 19999).  Offline test on held-out
# demos: delta aims the grasp much better than abs for all three tasks ->
# try delta first.  freeze_left in run.yaml (see there):
#   blue_cup: true (right arm only)   fold_towel / unroll_cylinder: FALSE
#   (both arms work; a frozen left arm makes these tasks fail)
#
# put_blue_block_in_blue_cup (100 demos), right arm only:
# model:
#   ckpt: models/act_ref_r3/blue_cup_delta.pt
#   format: act_ref
#   task: put_blue_block_in_blue_cup
#   action_mode: delta          # blue_cup_abs.pt -> abs
#   compensate_action_shift: false
#
# fold_towel (51 demos), both arms:
# model:
#   ckpt: models/act_ref_r3/fold_towel_delta.pt
#   format: act_ref
#   task: fold_towel
#   action_mode: delta          # fold_towel_abs.pt -> abs
#   compensate_action_shift: false
#
# unroll_cylinder (50 demos), both arms:
# model:
#   ckpt: models/act_ref_r3/unroll_cylinder_delta.pt
#   format: act_ref
#   task: unroll_cylinder
#   action_mode: delta          # unroll_cylinder_abs.pt -> abs
#   compensate_action_shift: false

# ---- yam_train pi05 model (one model, both tasks; runs in a policy server) ----
model:
  server: 127.0.0.1:8100 # not 8000: cyy's openpi servers/clients use 8000
  model_dir: models/pi05_yam
  format: pi05
  task: put_block_in_bowl
  action_mode: delta
#
# pi05 = pi0.5 (openpi, 3.3B parameters) fine-tuned by yam_train
# (pi05 branch).  The network runs in a separate policy server
# process (openpi venv, GPU).  With model_dir, run_robot.sh starts
# it itself when nothing listens on `server` (~1-2 min to load) and
# stops it at exit; log: runs_infer/pi05_server.log.  openpi venv:
# OPENPI_DIR in robot.env (run_robot.sh has a default).
#   server       host:port of the server (127.0.0.1 = this PC)
#   model_dir    exported model directory (yam_model.json, params/,
#                assets/), relative to the project root.  Local
#                server only.  If a server already listens, it is
#                used (it must serve model_dir).  Without model_dir,
#                start the server yourself (any machine):
#                  PYTHONPATH=<this project> <openpi python>
#                  -m yam_infer.pi05_server --model models/pi05_yam
#                  --host 0.0.0.0 --port 8100
#   task         put_block_in_bowl | put_blue_block_in_blue_cup (one model; the task picks the prompt)
#   action_mode  delta (the server already returns absolute targets; checked against the server)
# run.yaml for pi05: execution {mode: chunk, horizon: 25, blend_s: 0.1} (plan = 50 steps = 1.7 s)
